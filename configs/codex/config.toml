# Codex CLI — local fork MCP configuration
# Merge into $CODEX_HOME/config.toml (default ~/.codex/config.toml).
# Replace the absolute launcher path with the reviewed fork checkout.
# On Windows use forward slashes, e.g. D:/repos/codex-context-mode/start.mjs.
# Pin hooks to the same checkout using configs/codex/hooks.json.
# Hook commands use node with a quoted direct script path. In PowerShell,
# pinning Node itself requires: & "C:/Program Files/nodejs/node.exe" "C:/.../hooks/codex/<event>.mjs"
# A quoted executable without & is a string expression, not a command.

[features]
hooks = true

[mcp_servers.context-mode]
command = "node"
args = ["/absolute/path/to/codex-context-mode/start.mjs"]

[mcp_servers.context-mode.env]
CONTEXT_MODE_PLATFORM = "codex"

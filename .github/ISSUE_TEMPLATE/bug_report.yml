name: Bug Report
description: Report a bug. PRs are STRONGLY preferred — see below.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This fork supports Codex only. Include a reproducible prompt, full error output,
        OS/runtime version, local checkout revision and the absolute launcher path.
        See [CONTRIBUTING.md](https://github.com/hudrucan/codex-context-mode/blob/main/CONTRIBUTING.md).
        Self-upgrade is disabled; do not install an upstream package over this fork.

  - type: input
    id: codex-version
    attributes:
      label: Codex version
      description: Version of the Codex app or CLI that reproduced the problem.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: context-mode version
      description: |
        Include the version and Git revision of your reviewed local checkout.
      placeholder: "e.g. 0.9.23"
    validations:
      required: true

  - type: textarea
    id: debug-output
    attributes:
      label: Diagnostic output (REQUIRED)
      description: |
        Run diagnostics from your local checkout and paste the output:
        ```
        node "/absolute/path/to/codex-context-mode/cli.bundle.mjs" doctor
        ```
        Alternatively, run the ctx_doctor MCP tool. Include your OS and installation path.
        Self-upgrade is disabled for this fork; do not install an upstream release over it.
      placeholder: "Paste diagnostic output, OS, and installation path"
      render: text
    validations:
      required: true

  - type: textarea
    id: prompt
    attributes:
      label: Exact prompt that triggered the bug (REQUIRED)
      description: |
        Copy-paste the EXACT message you sent to the agent when the bug occurred.
        Not a summary — the literal prompt text. Without this, we cannot reproduce.
        **Issues without a prompt will be closed.**
      placeholder: |
        Example: "Read the file src/index.ts and explain what it does"
      render: text
    validations:
      required: true

  - type: textarea
    id: error-output
    attributes:
      label: Full error output (REQUIRED)
      description: |
        Paste the complete Codex tool error, without credentials or private data.
        Include tool name, error message, and any stack trace.
        **"It doesn't work" is not an error output.**
      render: text
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce (REQUIRED)
      description: |
        Minimal steps so anyone on your platform can reproduce this.
      placeholder: |
        1. Build the reviewed local checkout (include revision and path)
        2. Configure: (paste your mcp config)
        3. Send prompt: "..."
        4. See error: "..."
    validations:
      required: true

  - type: textarea
    id: what-you-tried
    attributes:
      label: What have you tried to fix it?
      description: |
        Did you try to debug it? What did you find?
        Remember: your AI agent can read our source code. Ask it to help.
      placeholder: |
        - Verified the reviewed checkout revision and Node version
        - Read hooks/codex/pretooluse.mjs, found that...
        - Tried running the hook manually with a Codex hook payload...
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have included local diagnostic output above
          required: true
        - label: I have recorded the local fork revision and launcher path
          required: true
        - label: I have searched existing issues for duplicates
          required: true
        - label: I have included steps to reproduce the issue
          required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (Ubuntu/Debian)
        - Linux (Fedora/RHEL)
        - Linux (Arch)
        - Linux (Other)
        - Windows (Git Bash)
        - Windows (WSL)
        - Windows (PowerShell)
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: JS Runtime
      description: "Node version (>= 22.5.0 required); include Bun if used"
      placeholder: "e.g. Node 22.5.0 or newer"
    validations:
      required: false
